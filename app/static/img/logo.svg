<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1db954"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1db954"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1db954"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="syncGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1db954" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" filter="url(#shadow)"/>

  <circle cx="180" cy="200" r="130" fill="#1db954" opacity="0.14" filter="url(#glow)"/>
  <circle cx="340" cy="220" r="130" fill="#ff0055" opacity="0.14" filter="url(#glow)"/>

  <g id="music-note" filter="url(#shadow)">
    <ellipse cx="200" cy="305" rx="40" ry="30" transform="rotate(-28 200 305)" fill="url(#noteGrad)"/>
    <ellipse cx="330" cy="265" rx="40" ry="30" transform="rotate(-28 330 265)" fill="url(#noteGrad)"/>

    <rect x="226" y="135" width="14" height="170" rx="7" fill="url(#noteGrad)"/>
    <rect x="356" y="95" width="14" height="170" rx="7" fill="url(#noteGrad)"/>

    <path d="M 226 135 L 370 95 L 370 133 L 226 173 Z" fill="url(#noteGrad)"/>

    <ellipse cx="193" cy="300" rx="20" ry="11" transform="rotate(-28 193 300)" fill="#ffffff" opacity="0.22"/>
    <ellipse cx="323" cy="260" rx="20" ry="11" transform="rotate(-28 323 260)" fill="#ffffff" opacity="0.22"/>
  </g>

  <g id="sync-badge" filter="url(#syncGlow)">
    <circle cx="120" cy="380" r="54" fill="#0d1424" stroke="url(#syncGrad)" stroke-width="4.5"/>
    <circle cx="120" cy="380" r="45" fill="#121b2d"/>

    <g transform="translate(90, 350) scale(2.5)" fill="none" stroke="url(#syncGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
      <path d="M21 3v5h-5"/>
      <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
      <path d="M3 21v-5h5"/>
    </g>
  </g>
</svg>
